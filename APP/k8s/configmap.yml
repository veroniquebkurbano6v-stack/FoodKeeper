apiVersion: v1
kind: ConfigMap
metadata:
  name: food-inventory-config
  namespace: food-inventory
  labels:
    app: food-inventory
    env: production
data:
  # 应用基础配置
  APP_NAME: "food-inventory-manager"
  PROFILE: "prod"
  SERVER_PORT: "8080"
  
  # MySQL 数据库配置（非敏感）
  MYSQL_HOST: "mysql-food-inventory"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "food_inventory_prod"
  
  # Redis 配置（非敏感）
  REDIS_HOST: "redis-food-inventory"
  REDIS_PORT: "6379"
  REDIS_DATABASE: "2"
  
  # JVM 参数
  JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof"
  
  # 日志配置
  LOGGING_LEVEL_ROOT: "WARN"
  LOGGING_LEVEL_APP: "INFO"
  LOGGING_FILE_NAME: "/app/logs/food-inventory-prod.log"
  
  # 连接池配置
  DB_MIN_IDLE: "20"
  DB_MAX_POOL_SIZE: "50"
  DB_IDLE_TIMEOUT: "60000"
  DB_MAX_LIFETIME: "1800000"
  DB_CONNECTION_TIMEOUT: "30000"