apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-inventory-manager
  namespace: food-inventory
  labels:
    app: food-inventory
    component: backend
    env: production
  annotations:
    deployment.kubernetes.io/revision: "1"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  # 副本数配置
  replicas: 3
  
  # 滚动更新策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  # 选择器
  selector:
    matchLabels:
      app: food-inventory
      component: backend
  
  # Pod 模板
  template:
    metadata:
      labels:
        app: food-inventory
        component: backend
        env: production
      annotations:
        # 自动注入 Vault 密钥（如果使用 HashiCorp Vault）
        vault.hashicorp.com/agent-inject: "false"
        # 配置变更触发滚动更新
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yml") . | sha256sum }}
    spec:
      # 优雅停机配置（等待30秒）
      terminationGracePeriodSeconds: 30
      
      # 安全上下文
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # 容器配置
      containers:
        - name: food-inventory-backend
          image: registry.example.com/food-inventory-manager:latest
          imagePullPolicy: Always
          
          # 端口配置
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: actuator
              containerPort: 8081
              protocol: TCP
          
          # 环境变量配置
          env:
            # 从 ConfigMap 注入非敏感配置
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: APP_NAME
            - name: PROFILE
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: PROFILE
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: SERVER_PORT
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: MYSQL_DATABASE
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: REDIS_PORT
            - name: REDIS_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: REDIS_DATABASE
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: JAVA_OPTS
            - name: LOGGING_LEVEL_ROOT
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: LOGGING_LEVEL_ROOT
            - name: LOGGING_LEVEL_APP
              valueFrom:
                configMapKeyRef:
                  name: food-inventory-config
                  key: LOGGING_LEVEL_APP
            
            # 从 Secret 注入敏感配置
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: food-inventory-secret
                  key: mysql-username
            - name: MYSQL_PASSWORD_ENCRYPTED
              valueFrom:
                secretKeyRef:
                  name: food-inventory-secret
                  key: mysql-password-encrypted
            - name: REDIS_PASSWORD_ENCRYPTED
              valueFrom:
                secretKeyRef:
                  name: food-inventory-secret
                  key: redis-password-encrypted
            - name: JASYPT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: food-inventory-secret
                  key: jasypt-password
          
          # 资源限制配置
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          # 存活探针（Liveness Probe）
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: actuator
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          
          # 就绪探针（Readiness Probe）
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: actuator
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 2
          
          # 启动探针（Startup Probe）
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: actuator
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
            successThreshold: 1
          
          # 生命周期钩子
          lifecycle:
            preStop:
              exec:
                command:
                  - "sh"
                  - "-c"
                  - "sleep 5"
            postStart:
              exec:
                command:
                  - "sh"
                  - "-c"
                  - "echo 'Container started' >> /app/logs/startup.log"
          
          # 日志持久化挂载
          volumeMounts:
            - name: logs-volume
              mountPath: /app/logs
              subPath: logs
            - name: data-volume
              mountPath: /app/data
              subPath: data
            - name: config-volume
              mountPath: /app/config
          
      # 卷配置
      volumes:
        - name: logs-volume
          persistentVolumeClaim:
            claimName: food-inventory-logs-pvc
        - name: data-volume
          persistentVolumeClaim:
            claimName: food-inventory-data-pvc
        - name: config-volume
          configMap:
            name: food-inventory-config
            items:
              - key: LOGGING_FILE_NAME
                path: logging.properties
      
      # 镜像拉取策略
      imagePullSecrets:
        - name: regcred
      
      # 调度配置
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - food-inventory
                topologyKey: kubernetes.io/hostname