apiVersion: v1
kind: Service
metadata:
  name: food-inventory-service
  namespace: food-inventory
  labels:
    app: food-inventory
    component: backend
    env: production
  annotations:
    # 启用外部负载均衡健康检查
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/actuator/health"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # Prometheus 监控
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
    - name: actuator
      port: 8081
      targetPort: actuator
      protocol: TCP
      appProtocol: http
  selector:
    app: food-inventory
    component: backend
  sessionAffinity: None