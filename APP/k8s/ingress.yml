apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-inventory-ingress
  namespace: food-inventory
  labels:
    app: food-inventory
    component: backend
    env: production
  annotations:
    # NGINX Ingress Controller 配置
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    
    # 健康检查配置
    nginx.ingress.kubernetes.io/health-check-path: "/actuator/health"
    nginx.ingress.kubernetes.io/health-check-interval: "10s"
    nginx.ingress.kubernetes.io/health-check-timeout: "5s"
    
    # 请求头配置
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    
    # 限流配置（可选）
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-rpm: "1000"
    
    # 安全配置
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    
    # Gzip压缩
    nginx.ingress.kubernetes.io/gzip: "true"
    nginx.ingress.kubernetes.io/gzip-types: "text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript"
    
    # 缓存配置
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    
    # 跨域配置
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Requested-With"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"
    
    # 请求限流（使用 nginx.ingress.kubernetes.io/limit-* 注解）
    nginx.ingress.kubernetes.io/limit-whitelist: "10.0.0.0/8"
    
    # 启用 WebSocket（如果需要）
    nginx.ingress.kubernetes.io/websocket-services: "food-inventory-service"
    nginx.ingress.kubernetes.io/proxy-upgrade: "true"
    nginx.ingress.kubernetes.io/proxy-set-header: |
      Upgrade $http_upgrade;
      Connection "upgrade";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.food-inventory.example.com
        - food-inventory.example.com
      secretName: food-inventory-tls
  rules:
    - host: api.food-inventory.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: food-inventory-service
                port:
                  name: http
    
    - host: food-inventory.example.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: food-inventory-service
                port:
                  name: http
          - path: /system/
            pathType: Prefix
            backend:
              service:
                name: food-inventory-service
                port:
                  name: http
          - path: /actuator/
            pathType: Prefix
            backend:
              service:
                name: food-inventory-service
                port:
                  name: actuator