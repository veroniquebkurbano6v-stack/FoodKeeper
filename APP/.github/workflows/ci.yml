# ============================================
# 食库管家 CI/CD 流水线配置
# GitHub Actions
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/food-inventory

jobs:
  # ============================================
  # 阶段一：代码静态检查
  # ============================================
  lint:
    name: Code Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Backend Lint (Spotless)
        run: |
          cd backend
          mvn spotless:check -B || true

      - name: Backend Checkstyle
        run: |
          cd backend
          mvn checkstyle:check -B || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Lint
        run: |
          cd frontend
          npm ci
          npm run lint || true

      - name: Frontend Format Check
        run: |
          cd frontend
          npx prettier --check src/ || true

  # ============================================
  # 阶段二：后端单元测试
  # ============================================
  backend-test:
    name: Backend Unit Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: food_inventory_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run Backend Tests
        run: |
          cd backend
          mvn test -B -Dspring.profiles.active=test \
            -Dmysql.host=127.0.0.1 \
            -Dmysql.port=3306

      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

      - name: Generate Coverage Report
        run: |
          cd backend
          mvn jacoco:report -B || true

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: backend/target/site/jacoco/jacoco.xml
          flags: unittests
          name: backend-coverage

  # ============================================
  # 阶段三：前端单元测试
  # ============================================
  frontend-test:
    name: Frontend Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test:unit || true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: frontend-test-reports
          path: frontend/coverage/

  # ============================================
  # 阶段四：构建后端镜像
  # ============================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      backend-image: ${{ steps.build.outputs.BACKEND_IMAGE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Backend Image ID
        run: |
          echo "BACKEND_IMAGE=${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}" > backend_image.txt

      - name: Upload Backend Image Info
        uses: actions/upload-artifact@v3
        with:
          name: backend-image
          path: backend_image.txt

  # ============================================
  # 阶段五：构建前端镜像
  # ============================================
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      frontend-image: ${{ steps.build.outputs.FRONTEND_IMAGE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Frontend Image ID
        run: |
          echo "FRONTEND_IMAGE=${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT

      - name: Upload Frontend Image Info
        uses: actions/upload-artifact@v3
        with:
          name: frontend-image
          path: frontend_image.txt

  # ============================================
  # 阶段六：漏洞扫描
  # ============================================
  security-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Backend Image
        uses: actions/download-artifact@v3
        with:
          name: backend-image
          path: .

      - name: Load Backend Image
        run: |
          docker load --input $(cat backend_image.txt | head -1 | cut -d' ' -f1).tar 2>/dev/null || true

      - name: Run Trivy Vulnerability Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'backend-vulnerabilities.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Backend Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: backend-vulnerabilities.sarif

      - name: Run Trivy FS Scanner
        run: |
          trivy fs --severity HIGH,CRITICAL . || true

  # ============================================
  # 阶段七：部署到测试环境
  # ============================================
  deploy-test:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Images
        uses: actions/download-artifact@v3
        with:
          name: backend-image
          path: .

      - name: Download Images
        uses: actions/download-artifact@v3
        with:
          name: frontend-image
          path: .

      - name: Deploy to Test Server
        run: |
          echo "部署到测试环境..."
          # 这里可以添加 SSH 部署命令
          # scp docker-compose.yml user@server:/path/
          # ssh user@server "docker-compose -f docker-compose.yml up -d"

  # ============================================
  # 阶段八：部署到生产环境
  # ============================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Images
        uses: actions/download-artifact@v3
        with:
          name: backend-image
          path: .

      - name: Download Images
        uses: actions/download-artifact@v3
        with:
          name: frontend-image
          path: .

      - name: Deploy to Production Server
        run: |
          echo "部署到生产环境..."
          # 这里可以添加 SSH 部署命令
          # scp docker-compose.yml user@server:/path/
          # ssh user@server "docker-compose -f docker-compose.yml up -d"

      - name: Notify Deployment
        if: always()
        run: |
          echo "部署状态: ${{ job.status }}"