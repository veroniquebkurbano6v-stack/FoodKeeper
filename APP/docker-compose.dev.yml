# ============================================
# 开发环境 Docker Compose 配置
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: food-mysql-dev
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: food_inventory
      MYSQL_USER: food_user
      MYSQL_PASSWORD: food123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - food-dev-network

  redis:
    image: redis:7-alpine
    container_name: food-redis-dev
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - food-dev-network

networks:
  food-dev-network:
    driver: bridge

volumes:
  mysql-dev-data:
  redis-dev-data: