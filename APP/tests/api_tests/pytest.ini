[pytest]
# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = testcases

# 命令行默认参数
addopts = -v --tb=short --alluredir=reports/allure-results

# 标记定义
markers =
    smoke: 冒烟测试，核心功能验证
    critical: 关键功能测试
    normal: 正常场景测试
    boundary: 边界条件测试
    exception: 异常场景测试
    security: 安全相关测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# 文件日志
log_file = reports/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S